syntax = "proto3";

package example.complex;

option java_package = "com.example.complex";
option go_package = "github.com/example/complex";

enum Status {
  UNKNOWN = 0;
  ACTIVE = 1;
  INACTIVE = 2;
  DELETED = 3;
}

message User {
  string id = 1;
  string email = 2;
  repeated string roles = 3;
  Status status = 4;
  
  message Profile {
    string first_name = 1;
    string last_name = 2;
    int32 age = 3;
  }
  
  Profile profile = 5;
  map<string, string> metadata = 6;
  
  oneof contact {
    string phone = 7;
    string address = 8;
  }
  
  reserved 10 to 15;
  reserved "old_field", "deprecated_field";
}

service UserService {
  rpc GetUser (GetUserRequest) returns (User) {}
  rpc ListUsers (ListUsersRequest) returns (stream User) {}
  rpc UpdateUser (stream UpdateUserRequest) returns (UpdateUserResponse) {}
  rpc StreamUsers (stream StreamUserRequest) returns (stream User) {}
}

message GetUserRequest {
  string id = 1;
}

message ListUsersRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message UpdateUserRequest {
  User user = 1;
  repeated string update_mask = 2;
}

message UpdateUserResponse {
  User user = 1;
}

message StreamUserRequest {
  oneof request {
    GetUserRequest get = 1;
    ListUsersRequest list = 2;
  }
}