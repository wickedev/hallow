syntax = "proto3";

package test.basic;

// Simple message with various field types
message User {
  string id = 1;
  string name = 2;
  int32 age = 3;
  bool is_active = 4;
  double balance = 5;
  bytes avatar = 6;
}

// Message with repeated and optional fields
message Team {
  string id = 1;
  string name = 2;
  repeated User members = 3;
  optional User leader = 4;
  repeated string tags = 5;
}

// Nested message example
message Company {
  string id = 1;
  string name = 2;
  
  message Address {
    string street = 1;
    string city = 2;
    string country = 3;
    string postal_code = 4;
  }
  
  Address headquarters = 3;
  repeated Address offices = 4;
}